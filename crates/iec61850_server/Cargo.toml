[package]
name = "iec61850-cmd-server"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "iec61850_server command line. Package name avoids the taken crates.io name iec61850-server."
repository = "https://github.com/alfred-hong/iec61850-cmd"
homepage = "https://github.com/alfred-hong/iec61850-cmd"
readme = "README.md"

[[bin]]
name = "iec61850_server"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
